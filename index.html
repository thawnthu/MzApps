<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MzChat - Mizo Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#008069;padding:15px;text-align:center;font-weight:bold;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{background:#202c33;padding:10px 15px;border-radius:10px;max-width:80%}
.me{background:#005c4b;align-self:flex-end}
.input-area{display:flex;padding:10px;background:#202c33;gap:10px}
input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
button{background:#008069;color:white;border:none;padding:12px 20px;border-radius:25px;font-weight:bold}
</style>
</head>
<body>
<div class="header">MzChat 💬</div>
<div id="chat"></div>
<div class="input-area">
<input id="msgInput" placeholder="Thil ziak rawh...">
<button onclick="send()">Send</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('msgInput');
let msgs=JSON.parse(localStorage.getItem('mzchat')||'[]');
function render(){chat.innerHTML='';msgs.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.me?'me':'');d.textContent=m.text;chat.appendChild(d)});chat.scrollTop=chat.scrollHeight}
function send(){if(!input.value)return;msgs.push({text:input.value,me:true});localStorage.setItem('mzchat',JSON.stringify(msgs));input.value='';render()}
input.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
render();
if(msgs.length==0){msgs=[{text:'Chibai Boss! MzChat ah lo lawm a che! 🎉',me:false}];render()}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MzChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#008069;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:22px}
.plus{width:40px;height:40px;background:white;color:#008069;border-radius:50%;border:none;font-size:28px;font-weight:bold}
#contacts{position:fixed;top:0;left:0;right:0;bottom:0;background:#111b21;z-index:10;display:none;flex-direction:column}
#contacts.show{display:flex}
.c-head{background:#008069;padding:15px;display:flex;justify-content:space-between;align-items:center}
.c-list{flex:1;overflow-y:auto}
.contact{padding:15px;border-bottom:1px solid #202c33;display:flex;gap:12px;align-items:center}
.contact:active{background:#202c33}
.avatar{width:45px;height:45px;background:#008069;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:#0b141a}
.msg{background:#202c33;padding:8px 12px;border-radius:8px;max-width:75%}
.me{background:#005c4b;align-self:flex-end}
.input-area{display:flex;padding:10px;background:#202c33;gap:8px}
input{flex:1;padding:12px 18px;border-radius:25px;border:none;outline:none;background:#2a3942;color:white}
button.send{background:#008069;color:white;border:none;padding:10px 18px;border-radius:25px}
.add-box{padding:15px;display:flex;gap:8px;background:#202c33}
</style>
</head>
<body>
<div class="header">
<b id="chatName">MzChat 💬</b>
<button class="plus" onclick="openContacts()">+</button>
</div>

<div id="contacts">
<div class="c-head"><b>Contacts</b><button onclick="closeContacts()" style="background:none;border:none;color:white;font-size:24px">✕</button></div>
<div class="add-box">
<input id="newName" placeholder="Hming thar...">
<button class="send" onclick="addContact()">Add</button>
</div>
<div class="c-list" id="cList"></div>
</div>

<div id="chat"></div>
<div class="input-area">
<input id="msgInput" placeholder="Message...">
<button class="send" onclick="send()">➤</button>
</div>

<script>
let contacts=JSON.parse(localStorage.getItem('mzcontacts')||'[{"name":"Amuana","letter":"A"},{"name":"Zovi","letter":"Z"},{"name":"Mami","letter":"M"}]');
let current=contacts[0].name;
let allMsgs=JSON.parse(localStorage.getItem('mzall')||'{}');

function save(){localStorage.setItem('mzcontacts',JSON.stringify(contacts));localStorage.setItem('mzall',JSON.stringify(allMsgs))}

function openContacts(){document.getElementById('contacts').classList.add('show');renderContacts()}
function closeContacts(){document.getElementById('contacts').classList.remove('show')}

function renderContacts(){
let html='';contacts.forEach(c=>{
html+=`<div class="contact" onclick="selectContact('${c.name}')"><div class="avatar">${c.letter}</div><div><b>${c.name}</b><br><small style="opacity:0.6">Tap to chat</small></div></div>`;
});
document.getElementById('cList').innerHTML=html;
}

function selectContact(name){current=name;document.getElementById('chatName').innerText=name;closeContacts();renderChat()}

function addContact(){
let n=document.getElementById('newName').value.trim();if(!n)return;
contacts.push({name:n,letter:n[0].toUpperCase()});document.getElementById('newName').value='';save();renderContacts();
}

function renderChat(){
let chat=document.getElementById('chat');let msgs=allMsgs[current]||[];chat.innerHTML='';
if(msgs.length==0){chat.innerHTML=`<div class="msg">${current} nen in chat tan rawh! 👋</div>`;return}
msgs.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.me?'me':'');d.textContent=m.text;chat.appendChild(d)});
chat.scrollTop=chat.scrollHeight;
}

function send(){
let input=document.getElementById('msgInput');if(!input.value.trim())return;
if(!allMsgs[current])allMsgs[current]=[];
allMsgs[current].push({text:input.value,me:true});save();input.value='';renderChat();
setTimeout(()=>{allMsgs[current].push({text:"Ok Boss! 😊",me:false});save();renderChat()},800);
}

document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
document.getElementById('chatName').innerText=current;
renderChat();
renderContacts();
</script>
</body>
</html>

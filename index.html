<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MzApps</title>
<style>
body{background:#111b21;color:#fff;margin:0;font-family:sans-serif}
.header{background:#202c33;padding:15px;font-size:20px;font-weight:bold}
.tabs{display:flex;justify-content:space-around;background:#202c33;color:#00a884;padding:10px}
.item{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #222}
.btn{padding:6px 14px;border-radius:20px;font-size:12px;border:none;font-weight:bold}
.chat{background:#00a884;color:#fff}
.invite{background:#333;color:#ccc}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="header">MzApps - Contact Check</div>
<div class="tabs"><span>Chats</span><span>Status</span><span>Calls</span></div>
<div id="list" style="padding-top:20px;text-align:center;color:#8696a0">Contact check mek...</div>

<script>
const firebaseConfig = {apiKey:"AIzaSyBc6P6havWW5Re2V6FBPz3yToQ5i_ihAcw",authDomain:"thawnthu-e3b68.firebaseapp.com",databaseURL:"https://thawnthu-e3b68-default-rtdb.firebaseio.com",projectId:"thawnthu-e3b68"};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

async function start(){
  const listDiv = document.getElementById('list');
  try{
    // 1. Permission check - Capacitor awm lo chuan browser a ni
    let contacts = [];
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Contacts){
        const {Contacts} = window.Capacitor.Plugins;
        const perm = await Contacts.requestPermissions();
        if(perm.contacts!== 'granted'){
            listDiv.innerHTML = "Contact permission Allow rawh.<br><button onclick='location.reload()' style='margin-top:10px;padding:8px 15px'>Reload</button>";
            return;
        }
        const result = await Contacts.getContacts({projection:{name:true,phones:true}});
        contacts = result.contacts || [];
    } else {
        // Browser testing tan
        listDiv.innerHTML = "Browser ah contact a lang lo - APK ah a lang ang";
        return;
    }

    if(contacts.length===0){
        listDiv.innerHTML = "Contact a awm lo";
        return;
    }

    // 2. Firebase users la - FAST
    const snap = await db.ref('users').once('value');
    const users = snap.val() || {};
    const userPhones = new Set(Object.values(users).map(u=> (u.phone||'').replace(/\D/g,'').slice(-10) ));

    // 3. Show
    listDiv.innerHTML = "";
    listDiv.style.textAlign = "left";
    contacts.forEach(c=>{
        if(!c.phones ||!c.phones[0]) return;
        let phone = c.phones[0].number.replace(/\D/g,'').slice(-10);
        let name = c.name?.display || "Unknown";
        let isMzUser = userPhones.has(phone);
        let div = document.createElement('div');
        div.className = "item";
        div.innerHTML = `<span>${name}<br><small style='color:#8696a0'>${phone}</small></span><button class='btn ${isMzUser?'chat':'invite'}'>${isMzUser?'CHAT':'INVITE'}</button>`;
        if(isMzUser) div.onclick = ()=> location.href='chat.html?user='+phone;
        listDiv.appendChild(div);
    });

  }catch(e){
    document.getElementById('list').innerHTML = "Error: "+e.message+"<br><button onclick='location.reload()'>Retry</button>";
    console.log(e);
  }
}
setTimeout(start, 500);
</script>
</body>
</html>

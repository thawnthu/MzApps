<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MzApps Ultra</title>
<meta name="theme-color" content="#000">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;MzApps&quot;,&quot;short_name&quot;:&quot;MzApps&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#000&quot;,&quot;theme_color&quot;:&quot;#000&quot;}">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.h{padding:12px 16px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.c{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.m{max-width:78%;padding:9px 12px;border-radius:18px;font-size:15px;line-height:1.3;word-break:break-word;animation:p .2s ease}
.me{background:#fff;color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.ot{background:#1c1c1e;align-self:flex-start;border-bottom-left-radius:4px}
.b{padding:8px 10px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid #1a1a1a;background:#000}
.b input{flex:1;background:#1c1c1e;border:none;padding:11px 14px;border-radius:22px;color:#fff;outline:none;font-size:16px}
.b button{background:#fff;color:#000;border:none;width:38px;height:38px;border-radius:50%;font-weight:900;display:grid;place-items:center}
@keyframes p{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="h"><span>MzApps ⚡ ULTRA</span><span id="s" style="font-size:11px;color:#0f0">● LIVE</span></div>
<div id="c" class="c"></div>
<div class="b"><input id="i" placeholder="Message..." autocomplete="off"><button onclick="S()">➤</button></div>

<script type="module">
// ULTRA FAST - NO REACT, NO VITE
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"
import{getDatabase,ref,push,onChildAdded,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"

const cfg={apiKey:"AIzaSyCYP1iIoI7KsJIcw0mP0s6_EYZ8JWmIQXU",authDomain:"thawnthu-e3b68.firebaseapp.com",databaseURL:"https://thawnthu-e3b68-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"thawnthu-e3b68"};
const app=initializeApp(cfg),db=getDatabase(app);
let me=localStorage.getItem("mz_u")||prompt("Hming:")||"User";localStorage.setItem("mz_u",me);

const c=document.getElementById("c"),inp=document.getElementById("i");
const r=ref(db,"ultra");

onChildAdded(r,s=>{
  let d=s.val();
  let div=document.createElement("div");
  div.className="m "+(d.u==me?"me":"ot");
  div.innerHTML=`<div style="font-size:10px;opacity:.6">${d.u}</div>${d.m}`;
  c.appendChild(div);
  c.scrollTop=c.scrollHeight;
});

window.S=()=>{
  if(!inp.value.trim())return;
  push(r,{u:me,m:inp.value,t:serverTimestamp()});
  inp.value="";
};
inp.onkeydown=e=>{if(e.key=="Enter")S()};

// Preload
c.innerHTML="<div class='m ot'>MzApps Ultra a nung! ⚡ 10x chak zawk!</div>";
</script>
</body>
</html>

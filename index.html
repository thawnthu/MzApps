<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MzApps</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:system-ui;height:100dvh}
.screen{height:100dvh;display:flex;flex-direction:column;padding:24px;justify-content:center;align-items:center}
#main,#s2,#s3{display:none}
h1{color:#008069;font-size:22px;font-weight:400;text-align:center}
.sub{font-size:14px;color:#667781;text-align:center;margin:12px 0 24px}
.rowIn{display:flex;gap:12px;width:100%;max-width:320px;border-bottom:2px solid #008069;padding:8px 0;margin-bottom:20px}
.rowIn select,.rowIn input{border:none;outline:none;font-size:16px;background:#fff}
.btn{padding:12px 40px;border-radius:24px;border:none;background:#008069;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="s1" class="screen">
<h1>Phone number chhu lut rawh</h1>
<p class="sub">MzApps hian i phone number a verify ang.</p>
<div class="rowIn">
<select id="cc"><option>+91</option></select>
<input id="p" type="tel" value="7005697815" style="flex:1">
</div>
<button class="btn" onclick="goNext()">NEXT</button>
<button onclick="clearAll()" style="margin-top:20px;background:none;border:none;color:red;font-size:12px">Clear old data</button>
</div>

<div id="s2" class="screen">
<h1>Verify <span id="showP"></span></h1>
<p class="sub">Code: <b id="otpShow" style="color:#008069;font-size:20px">123456</b></p>
<div style="display:flex;gap:6px"><input id="o1" style="width:40px;height:40px;text-align:center;border:none;border-bottom:2px solid #008069;outline:none"><input id="o2" style="width:40px;height:40px;text-align:center;border:none;border-bottom:2px solid #008069;outline:none"><input id="o3" style="width:40px;height:40px;text-align:center;border:none;border-bottom:2px solid #008069;outline:none"><input id="o4" style="width:40px;height:40px;text-align:center;border:none;border-bottom:2px solid #008069;outline:none"><input id="o5" style="width:40px;height:40px;text-align:center;border:none;border-bottom:2px solid #008069;outline:none"><input id="o6" style="width:40px;height:40px;text-align:center;border:none;border-bottom:2px solid #008069;outline:none"></div>
<button class="btn" style="margin-top:20px" onclick="goVerify()">VERIFY</button>
</div>

<div id="s3" class="screen">
<h1>Profile info</h1>
<input id="n" placeholder="I hming" style="padding:14px;border:none;border-bottom:2px solid #008069;outline:none;width:100%;max-width:300px;text-align:center;font-size:18px;margin:20px 0">
<button class="btn" onclick="goProfile()">NEXT</button>
</div>

<div id="main" style="flex-direction:column;height:100dvh">
<div style="background:#008069;color:#fff;padding:14px;font-weight:800">MzApps - <span id="uname"></span></div>
<div id="chatList" style="flex:1;overflow:auto;padding:10px">Chat a la awm lo - + hmeh rawh</div>
<button onclick="openContacts()" style="position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#008069;border-radius:50%;border:none;color:#fff;font-size:28px">+</button>
<div id="contacts" style="position:fixed;inset:0;background:#fff;display:none;flex-direction:column"><div style="background:#008069;color:#fff;padding:14px"><span onclick="closeContacts()">←</span> Contacts</div><div id="contactList" style="flex:1;overflow:auto;padding:10px"></div></div>
</div>

<script>
// GLOBAL FUNCTIONS - NO MODULE
let fake="123456";
let curP="";

function goNext(){
  let p=document.getElementById("p").value.trim();
  if(p.length<5){alert("Phone chhu rawh!");return;}
  curP=p;
  fake=Math.floor(100000+Math.random()*900000).toString();
  document.getElementById("showP").innerText="+91 "+p;
  document.getElementById("otpShow").innerText=fake;
  document.getElementById("s1").style.display="none";
  document.getElementById("s2").style.display="flex";
  // auto fill
  setTimeout(()=>{for(let i=1;i<=6;i++)document.getElementById("o"+i).value=fake[i-1];},500);
}
function goVerify(){
  let code=[1,2,3,4,5,6].map(i=>document.getElementById("o"+i).value).join("");
  if(code!==fake){alert("Code dik lo! Code chu: "+fake);return;}
  document.getElementById("s2").style.display="none";
  document.getElementById("s3").style.display="flex";
}
function goProfile(){
  let n=document.getElementById("n").value.trim();
  if(n.length<2){alert("Hming!");return;}
  let me={p:curP,n:n};
  localStorage.setItem("mz_super",JSON.stringify(me));
  try{firebase.initializeApp({databaseURL:"https://thawnthu-e3b68-default-rtdb.asia-southeast1.firebasedatabase.app"});firebase.database().ref("mz_users/"+curP).set({p:curP,n:n});}catch(e){}
  document.getElementById("s3").style.display="none";
  document.getElementById("main").style.display="flex";
  document.getElementById("uname").innerText=n;
}
function clearAll(){localStorage.clear();alert("Clear fel! Refresh rawh!");location.reload();}
function openContacts(){document.getElementById("contacts").style.display="flex";let cl=document.getElementById("contactList");cl.innerHTML="Loading...";try{firebase.database().ref("mz_users").once("value").then(s=>{cl.innerHTML="";Object.values(s.val()||{}).forEach((u)=>{if(u.p==curP||u.p==JSON.parse(localStorage.getItem("mz_super")||"{}").p)return;let d=document.createElement("div");d.style.padding="12px";d.style.borderBottom="1px solid #eee";d.innerText=u.n+" - "+u.p;cl.appendChild(d);});});}catch{cl.innerHTML="MzApps hmangtu an la awm lo - Invite rawh!";}}
function closeContacts(){document.getElementById("contacts").style.display="none";}

// auto login if already
let me=localStorage.getItem("mz_super");
if(me){me=JSON.parse(me);curP=me.p;document.getElementById("s1").style.display="none";document.getElementById("main").style.display="flex";document.getElementById("uname").innerText=me.n;}
</script>
</body>
</html>

<script src="capacitor.js"></script>
<script>
async function loadMzAppsContacts(){
  try{
    const { Contacts } = Capacitor.Plugins;
    await Contacts.requestPermissions();
    const res = await Contacts.getContacts({projection:{name:true, phones:true}});
    let real = res.contacts.filter(c=>c.name).map(c=>({name:c.name.display, phone:c.phones?.[0]?.number||''}));
    localStorage.setItem('mzcontacts', JSON.stringify(real));
    location.reload();
  }catch(e){ alert("Phalna pe rawh: Settings > MzApps > Contacts Allow"); }
}
if(window.Capacitor) loadMzAppsContacts();
</script>

<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MzApps</title></head><body style="background:#111;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">
<div id="a">MzApps Loading...</div>
<script>
async function load(){
  try{
    let r=await fetch('https://thawnthu.github.io/MzApps/app.html?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    let h=await r.text();
    localStorage.setItem('app_cache',h);
    document.open();document.write(h);document.close();
  }catch{
    let c=localStorage.getItem('app_cache');
    if(c){document.open();document.write(c);document.close();}
    else document.getElementById('a').innerText='Offline - Connect Internet';
  }
} load();
</script></body></html>

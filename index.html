<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MzApps</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#111b21;color:#fff;font-family:system-ui;height:100dvh}
#login{height:100dvh;background:#111b21;display:flex;flex-direction:column;justify-content:center;padding:24px}
.inp{padding:16px;border-radius:12px;border:none;background:#202c33;color:#fff;width:100%;margin-bottom:12px;font-size:16px;outline:none}
.btn{padding:16px;border-radius:12px;border:none;background:#00a884;color:#111b21;font-weight:900;font-size:16px;width:100%}
.top{background:#202c33;padding:14px 16px;display:flex;justify-content:space-between;font-weight:800;align-items:center}
.list{flex:1;overflow-y:auto}.row{padding:12px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #1f2c33}
.av{width:48px;height:48px;background:#00a884;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#000}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#00a884;border-radius:50%;border:none;color:#111b21;font-size:28px;display:grid;place-items:center;z-index:5;cursor:pointer}
#contacts,#chatPage{position:fixed;inset:0;background:#111b21;z-index:20;display:none;flex-direction:column}
#c{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:#0b141a}
.m{max-width:75%;padding:8px 12px;border-radius:8px;font-size:14.5px;word-break:break-word}.me{background:#005c4b;align-self:flex-end}.ot{background:#202c33;align-self:flex-start}
.b{padding:8px;background:#202c33;display:flex;gap:8px}.b input{flex:1;background:#2a3942;border:none;padding:11px 14px;border-radius:22px;color:#fff;outline:none}
</style>
</head>
<body>

<div id="login">
<h1>MzApps 💬</h1><br>
<input id="p" class="inp" placeholder="Phone 7005697815">
<input id="n" class="inp" placeholder="Hming Nghaka">
<button class="btn" onclick="loginNow()">Lut rawh</button>
</div>

<div id="main" style="display:none;flex-direction:column;height:100dvh">
<div class="top"><span>MzApps</span><span id="uname" style="font-size:12px;color:#8696a0"></span></div>
<div id="chatList" class="list"><div style="padding:40px;text-align:center;color:#8696a0">Chat a la awm lo<br><small>+ hmeh in tan rawh</small></div></div>
<button class="fab" onclick="openContacts()">+</button>
</div>

<div id="contacts"><div class="top"><span onclick="closeContacts()" style="font-size:20px">←</span> Contacts</div><div id="contactList" class="list"></div></div>
<div id="chatPage"><div class="top"><span onclick="closeChat()" style="font-size:20px">←</span> <span id="chatName"></span></div><div id="c"></div><div class="b"><input id="i" placeholder="Message"><button onclick="sendMsg()" style="background:#00a884;border:none;width:42px;height:42px;border-radius:50%">➤</button></div></div>

<script>
// FIREBASE COMPAT - NO MODULE
const cfg={databaseURL:"https://thawnthu-e3b68-default-rtdb.asia-southeast1.firebasedatabase.app"};
firebase.initializeApp(cfg);
const db=firebase.database();

let me=JSON.parse(localStorage.getItem("mz_super")||"null");
let curChat=null;

function loginNow(){
  let p=document.getElementById("p").value.trim();
  let n=document.getElementById("n").value.trim();
  if(p.length<5 || n.length<2){alert("Phone leh Hming dik tak chhu rawh!");return}
  me={p:p,n:n};
  localStorage.setItem("mz_super",JSON.stringify(me));
  db.ref("mz_users/"+p).set({p:p,n:n,time:Date.now()});
  showMain();
}
function showMain(){
  document.getElementById("login").style.display="none";
  document.getElementById("main").style.display="flex";
  document.getElementById("uname").innerText=me.n;
  loadChatList();
}
if(me){showMain();}

function loadChatList(){
  db.ref("mz_chats/"+me.p).on("value",snap=>{
    let list=document.getElementById("chatList");
    let data=snap.val();
    if(!data){list.innerHTML="<div style='padding:40px;text-align:center;color:#8696a0'>Chat a la awm lo<br><small>+ hmeh in tan rawh</small></div>";return}
    list.innerHTML="";
    Object.entries(data).forEach(([phone,msgs])=>{
      let arr=Object.values(msgs); let last=arr[arr.length-1];
      let div=document.createElement("div");div.className="row";
      div.innerHTML=`<div class=av>${last.n[0]}</div><div><b>${last.n}</b><div style='font-size:13px;color:#8696a0'>${last.m.slice(0,30)}</div></div>`;
      div.onclick=()=>openChat(phone,last.n);
      list.appendChild(div);
    });
  });
}

function openContacts(){
  document.getElementById("contacts").style.display="flex";
  let cl=document.getElementById("contactList");cl.innerHTML="Loading...";
  db.ref("mz_users").once("value").then(snap=>{
    let users=Object.values(snap.val()||{});cl.innerHTML="";
    users.forEach(u=>{
      if(u.p==me.p)return;
      let div=document.createElement("div");div.className="row";
      div.innerHTML=`<div class=av>${u.n[0]}</div><div style='flex:1'><b>${u.n}</b><div style='font-size:12px;color:#8696a0'>${u.p}</div></div><button style='padding:6px 12px;border-radius:20px;border:none;background:#00a884;font-weight:700'>Chat</button>`;
      div.onclick=()=>openChat(u.p,u.n);
      cl.appendChild(div);
    });
    // Invite demo
    let inv=document.createElement("div");inv.innerHTML=`<div style='padding:12px;color:#8696a0;font-size:12px;border-top:1px solid #222'>Invite</div><div class=row><div class=av style='background:#333'>A</div><div style='flex:1'><b>Amawii</b><div style='font-size:12px;color:#8696a0'>98765 • hmang lo</div></div><button onclick="alert('Invite: mz-apps.vercel.app')" style='padding:6px 12px;border-radius:20px;border:1px solid #00a884;background:none;color:#00a884'>Invite</button></div>`;
    cl.appendChild(inv);
  });
}
function closeContacts(){document.getElementById("contacts").style.display="none";}
function openChat(phone,name){
  curChat=phone;
  closeContacts();
  document.getElementById("chatPage").style.display="flex";
  document.getElementById("chatName").innerText=name;
  let c=document.getElementById("c");c.innerHTML="";
  db.ref(`mz_chats/${me.p}/${phone}`).on("child_added",s=>addMsg(s.val()));
}
function addMsg(d){
  let c=document.getElementById("c");let div=document.createElement("div");div.className="m "+(d.p==me.p?"me":"ot");div.innerText=d.m;c.appendChild(div);c.scrollTop=c.scrollHeight;
}
function closeChat(){document.getElementById("chatPage").style.display="none";curChat=null;}
function sendMsg(){
  let inp=document.getElementById("i");if(!inp.value.trim()||!curChat)return;
  let msg={p:me.p,n:me.n,m:inp.value,time:Date.now()};
  db.ref(`mz_chats/${me.p}/${curChat}`).push(msg);
  db.ref(`mz_chats/${curChat}/${me.p}`).push(msg);
  inp.value="";
}
document.getElementById("i").addEventListener("keydown",e=>{if(e.key=="Enter")sendMsg()});
</script>
</body>
</html>

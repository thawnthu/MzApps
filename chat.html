<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
body{background:#0b141a;color:#fff;margin:0;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
.h{background:#202c33;padding:12px;display:flex;align-items:center;gap:10px}.h b{flex:1}
#msgs{flex:1;overflow-y:auto;padding:10px;background:#0b141a;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:75%;padding:8px 10px;border-radius:8px;font-size:14px;position:relative}
.me{align-self:flex-end;background:#005c4b}.you{align-self:flex-start;background:#202c33}
.tick{font-size:11px;color:#8696a0;float:right;margin-left:8px;margin-top:4px}.tick.read{color:#53bdeb}
.input{display:flex;padding:8px;background:#202c33;gap:8px}input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff}button{background:#00a884;border:none;border-radius:50%;width:44px;height:44px;color:#fff;font-size:20px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head><body>
<div class="h"><span onclick="history.back()" style="font-size:22px">←</span><b id="name">Chat</b><span>📞</span></div>
<div id="msgs"></div>
<div class="input"><input id="txt" placeholder="Message" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBc6P6havWW5Re2V6FBPz3yToQ5i_ihAcw",authDomain:"thawnthu-e3b68.firebaseapp.com",databaseURL:"https://thawnthu-e3b68-default-rtdb.firebaseio.com",projectId:"thawnthu-e3b68"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
const urlParams=new URLSearchParams(location.search); const otherPhone=urlParams.get('user')||"unknown";
const myPhone=localStorage.getItem('myPhone')||"8730"+Math.floor(Math.random()*10000000); // test phone
document.getElementById('name').innerText=otherPhone;
const chatId=[myPhone, otherPhone].sort().join('_');
const msgsDiv=document.getElementById('msgs');

function getTick(status){ if(status==='read') return `<span class="tick read">✓✓</span>`; if(status==='delivered') return `<span class="tick">✓✓</span>`; return `<span class="tick">✓</span>`; }

db.ref('messages/'+chatId).on('child_added',snap=>{
 let m=snap.val(); let isMe=m.from===myPhone;
 let div=document.createElement('div'); div.className='bubble '+(isMe?'me':'you');
 div.innerHTML=`${m.text}${isMe?getTick(m.status||'sent'):''}<br><small style='font-size:10px;color:#8696a066;float:right'>${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</small>`;
 msgsDiv.appendChild(div); msgsDiv.scrollTop=msgsDiv.scrollHeight;
 // auto mark delivered/read
 if(!isMe){ db.ref('messages/'+chatId+'/'+snap.key).update({status:'read'}); }
});

function send(){
 let t=document.getElementById('txt').value.trim(); if(!t)return;
 let msg={from:myPhone,to:otherPhone,text:t,time:Date.now(),status:'sent'};
 let ref=db.ref('messages/'+chatId).push(); ref.set(msg);
 document.getElementById('txt').value='';
 setTimeout(()=>ref.update({status:'delivered'}),500);
 setTimeout(()=>ref.update({status:'read'}),1500);
}
</script></body></html>

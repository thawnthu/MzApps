<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MzApps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111b21;color:#e9edef;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
.h{padding:12px 15px;background:#202c33;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
button{background:#00a884;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:bold}
.list{flex:1;overflow:auto}
.c{padding:14px 15px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.c:active{background:#202c33}
.chat-view{display:none;flex-direction:column;height:100vh;position:fixed;top:0;left:0;right:0;background:#0b141a;z-index:20}
.chat-header{padding:10px;background:#202c33;display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow:auto;padding:10px;background:#0b141a;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-repeat:repeat}
.msg{max-width:75%;padding:7px 10px;border-radius:8px;margin:5px 0;font-size:14px}
.me{background:#005c4b;margin-left:auto}
.them{background:#202c33}
.input-bar{display:flex;padding:8px;background:#202c33;gap:8px}
.input-bar input{flex:1;padding:10px;border-radius:20px;border:0;background:#2a3942;color:#fff;outline:none}
.input-bar button{border-radius:50%;width:44px;height:44px}
</style>
</head><body>

<!-- LIST VIEW -->
<div id="listView" style="display:flex;flex-direction:column;height:100vh">
  <div class="h"><b>MzApps</b><button onclick="pick()">+ Contact Thlang</button></div>
  <div style="padding:8px 15px;color:#8696a0;font-size:12px">Contact thlang la, chat theih ang</div>
  <div class="list" id="list"></div>
</div>

<!-- CHAT VIEW -->
<div id="chatView" class="chat-view">
  <div class="chat-header">
    <span onclick="back()" style="font-size:22px;padding:5px">←</span>
    <b id="chatName">Name</b>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="input-bar">
    <input id="msgInput" placeholder="Message" onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let contacts = JSON.parse(localStorage.getItem('mz_contacts')||'[]');
let chats = JSON.parse(localStorage.getItem('mz_chats')||'{}');
let cur = null;

function renderList(){
  let l=document.getElementById('list'); l.innerHTML='';
  if(contacts.length==0) l.innerHTML='<div style="text-align:center;padding:30px;color:#8696a0">Contact la thlang lo</div>';
  contacts.forEach((c,i)=>{
    let d=document.createElement('div'); d.className='c';
    d.innerHTML=`<div onclick="openChat(${i})"><b>${c.name}</b><br><small style="color:#8696a0">${(chats[i]&&chats[i].slice(-1)[0]?.t)||c.tel||''}</small></div><small onclick="del(event,${i})" style="color:red;padding:10px">X</small>`;
    l.appendChild(d);
  });
}
function openChat(i){
  cur=i;
  document.getElementById('listView').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('chatName').textContent=contacts[i].name;
  renderMsgs();
}
function back(){
  document.getElementById('chatView').style.display='none';
  document.getElementById('listView').style.display='flex';
  cur=null; renderList();
}
function renderMsgs(){
  let box=document.getElementById('msgs'); box.innerHTML='';
  (chats[cur]||[]).forEach(m=>{
    let div=document.createElement('div'); div.className='msg '+(m.me?'me':'them'); div.textContent=m.t;
    box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
}
function send(){
  let inp=document.getElementById('msgInput'); let t=inp.value.trim(); if(!t||cur===null) return;
  if(!chats[cur]) chats[cur]=[];
  chats[cur].push({t,me:true,time:Date.now()});
  // fake reply
  setTimeout(()=>{
    chats[cur].push({t:'Auto reply: '+t,me:false,time:Date.now()});
    localStorage.setItem('mz_chats',JSON.stringify(chats)); if(cur!==null) renderMsgs();
  },800);
  localStorage.setItem('mz_chats',JSON.stringify(chats));
  inp.value=''; renderMsgs();
}
function del(e,i){ e.stopPropagation(); contacts.splice(i,1); delete chats[i]; localStorage.setItem('mz_contacts',JSON.stringify(contacts)); localStorage.setItem('mz_chats',JSON.stringify(chats)); renderList(); }

async function pick(){
  try{
    if(!('contacts' in navigator)){ alert('Chrome update rawh - Contact Picker a support lo'); return; }
    let cs = await navigator.contacts.select(['name','tel'], {multiple:true});
    cs.forEach(c=>{
      contacts.push({name:c.name[0], tel:(c.tel[0]||'')});
    });
    localStorage.setItem('mz_contacts',JSON.stringify(contacts)); renderList();
  }catch(e){}
}
renderList();
</script>
</body></html>

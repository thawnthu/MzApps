<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MzApps Chat</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}.h{padding:14px;background:#202c33;position:sticky;top:0}.c{padding:12px;border-bottom:1px solid #222}</style>
</head><body>
<div class="h"><b id="cnt">MzApps - Contact 0</b> <button onclick="getC()" style="float:right;background:#00a884;color:#fff;border:0;padding:6px 12px;border-radius:6px">Reload</button></div>
<div id="list">Hmet rawh...</div>
<script type="module">
import { Contacts } from 'https://cdn.jsdelivr.net/npm/@capacitor-community/contacts@5/dist/esm/index.js';
window.getC = async ()=>{
  try{
    let p = await Contacts.requestPermissions();
    if(p.contacts!=='granted'){ alert('Permission pe rawh'); return; }
    let r = await Contacts.getContacts({ projection:{name:true, phones:true}});
    document.getElementById('cnt').innerText='Contact - '+r.contacts.length;
    let l=document.getElementById('list'); l.innerHTML='';
    r.contacts.filter(c=>c.name?.display).forEach(c=>{
      let d=document.createElement('div'); d.className='c';
      d.innerHTML=`<b>${c.name.display}</b><br><small>${c.phones?.[0]?.number||''}</small>`;
      d.onclick=()=>alert('Chat with '+c.name.display);
      l.appendChild(d);
    });
  }catch(e){ alert(e.message); }
};
getC();
</script></body></html>

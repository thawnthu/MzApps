name: Build MzApps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}

      - name: Build MzApps Native APK
        run: |
          rm -rf node_modules package-lock.json android www
          npm install --legacy-peer-deps

          # FIX 1: www folder siam - Hei hi a pawimawh ber!
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "copy html"
          cp -r *.html *.js *.css *.json www/ 2>/dev/null || true
          ls www/

          # FIX 2: webDir = www - "." ni lo!
          echo '{"appId":"com.mzapps.app","appName":"MzApps","webDir":"www"}' > capacitor.config.json
          cat capacitor.config.json

          npx cap add android
          npx cap copy

          # MzApps Contact Permission
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_CONTACTS" \/>\n<uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

          cd android && chmod +x gradlew &&./gradlew assembleDebug

      - name: Upload MzApps APK
        uses: actions/upload-artifact@v4
        with:
          name: MzApps-APK-WhatsApp-Style
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build MzApps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/contacts
          npx cap add android || true
      - name: Copy web to android
        run: npx cap copy
      - name: Add Contact Permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if grep -q "READ_CONTACTS" $FILE; then echo "Already has permission"; else sed -i 's/<\/manifest>/ <uses-permission android:name="android.permission.READ_CONTACTS" \/>\n <uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n<\/manifest>/' $FILE; fi
          cat $FILE
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build APK
        run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - name: Upload MzApps APK
        uses: actions/upload-artifact@v4
        with: {name: MzApps-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}

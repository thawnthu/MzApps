name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clean old files
        run: rm -rf src capacitor.config.json package.json index.html manifest.json README.md android www app.gradle gradle
      - name: Create APK Project
        run: |
          mkdir -p app/src/main/java/com/mzapps/app
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > gradlew << 'EOF'
          #!/bin/sh
          GRADLE_APP_PATH=$(dirname "$0")
          exec gradle "$@"
          EOF
          chmod +x gradlew
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mzapps.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.mzapps.app"
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.WRITE_CONTACTS" />
            <application android:label="MzApps" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/mzapps/app/MainActivity.java << 'EOF'
          package com.mzapps.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.Manifest; import android.content.pm.PackageManager; import androidx.core.app.ActivityCompat;
          public class MainActivity extends Activity {
            WebView wv;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              wv=new WebView(this);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient());
              setContentView(wv);
              wv.loadUrl("https://mz-apps.vercel.app");
              if(checkSelfPermission(Manifest.permission.READ_CONTACTS)!=PackageManager.PERMISSION_GRANTED){
                ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.READ_CONTACTS,Manifest.permission.WRITE_CONTACTS},1);
              }
            }
          }
          EOF
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MzApps-APK
          path: app/build/outputs/apk/debug/app-debug.apk

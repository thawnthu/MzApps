name: Build MzApps FINAL JAVA21
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Build FINAL JAVA 21
        run: |
          rm -rf node_modules android www
          npm install --legacy-peer-deps
          npm install @capacitor/push-notifications @capacitor/android --legacy-peer-deps
          mkdir -p www
          cp index.html www/ || echo "no index"
          cp chat.html www/ || echo "no chat"
          cp status.html www/ || echo "no status"
          cp calls.html www/ || echo "no calls"
          echo "{\"appId\":\"com.mzapps.app\",\"appName\":\"MzApps\",\"webDir\":\"www\",\"server\":{\"cleartext\":true}}" > capacitor.config.json
          npx cap add android
          sed -i "s/minSdkVersion = 22/minSdkVersion = 23/g" android/variables.gradle || true
          sed -i "s/minSdkVersion 22/minSdkVersion 23/g" android/app/build.gradle || true
          npx cap copy
          cp google-services.json android/app/google-services.json
          cd android && chmod +x gradlew &&./gradlew assembleDebug --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: MzApps-FINAL-APK-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk

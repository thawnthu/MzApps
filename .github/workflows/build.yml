name: Build MzApps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}

      - name: Build MzApps Native APK
        run: |
          rm -rf node_modules package-lock.json android
          npm install --legacy-peer-deps

          # 1. Config siam hmasa - Hei hi a pawimawh ber!
          echo '{"appId":"com.mzapps.app","appName":"MzApps","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json

          # 2. Chumi hnuah Android add chauh
          npx cap add android
          npx cap copy

          # 3. MzApps tan Contact Permission pe
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_CONTACTS" \/>\n<uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml

          # 4. Build
          cd android && chmod +x gradlew &&./gradlew assembleDebug

      - name: Upload MzApps APK
        uses: actions/upload-artifact@v4
        with:
          name: MzApps-APK-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk

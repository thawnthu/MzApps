name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: 18 }
      - uses: actions/setup-java@v3
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm install
      - run: npx cap add android
      - run: |
          sed -i 's/<manifest.*/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n <uses-permission android:name="android.permission.READ_CONTACTS" \/>\n <uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n <uses-permission android:name="android.permission.INTERNET" \/>/' android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: MzApps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

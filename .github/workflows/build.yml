name: Build MzApps FINAL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build Final
        run: |
          rm -rf node_modules android www
          npm install --legacy-peer-deps
          npm install @capacitor-community/contacts @capacitor/android --legacy-peer-deps
          mkdir -p www
          cp index.html www/
          cp chat.html www/ 2>/dev/null || echo "<h1>Chat</h1>" > www/chat.html
          echo "{\"appId\":\"com.mzapps.app\",\"appName\":\"MzApps\",\"webDir\":\"www\"}" > capacitor.config.json
          npx cap add android
          sed -i "s/minSdkVersion = 22/minSdkVersion = 23/g" android/variables.gradle || true
          sed -i '/<application/i \ <uses-permission android:name="android.permission.READ_CONTACTS" />\n <uses-permission android:name="android.permission.WRITE_CONTACTS" />' android/app/src/main/AndroidManifest.xml
          npx cap copy
          cp google-services.json android/app/google-services.json || true
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MzApps-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk

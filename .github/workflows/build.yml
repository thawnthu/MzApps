name: Build MzApps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build ONLINE FINAL
        run: |
          rm -rf node_modules android www
          npm install --legacy-peer-deps
          mkdir -p www
          echo "MzApps Online" > www/index.html
          echo '{"appId":"com.mzapps.app","appName":"MzApps","webDir":"www","server":{"url":"https://thawnthu.github.io/MzApps/","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap copy
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_CONTACTS" \/>\n<uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n<uses-permission android:name="android.permission.INTERNET" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MzApps-ONLINE-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --save || true
          npm install || true

      - name: Prepare Android
        run: |
          mkdir -p www
          echo "<html><body>Loading</body></html>" > www/index.html || true
          ls -la
          npx cap add android || echo "android exists"
          npx cap sync android || true
          ls -la android/
          ls -la android/app/ || true

      - name: Add Contact Permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          cat $FILE
          if ! grep -q "READ_CONTACTS" $FILE; then
            sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_CONTACTS" \/>\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n    <uses-permission android:name="android.permission.GET_ACCOUNTS" \/>/' $FILE
          fi
          cat $FILE

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew || chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MzApps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

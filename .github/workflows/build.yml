name: Build MzApps FINAL NOTIFICATION
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build With Firebase Notification
        run: |
          rm -rf node_modules android www
          npm install --legacy-peer-deps
          npm install @capacitor/push-notifications @capacitor/android --legacy-peer-deps
          mkdir -p www
          cp index.html www/ || echo "no index"
          cp chat.html www/ || echo "no chat"
          cp google-services.json www/ || true
          echo "{\"appId\":\"com.mzapps.app\",\"appName\":\"MzApps\",\"webDir\":\"www\",\"server\":{\"cleartext\":true},\"plugins\":{\"PushNotifications\":{\"presentationOptions\":[\"badge\",\"sound\",\"alert\"]}}}" > capacitor.config.json
          npx cap add android
          npx cap copy
          cp google-services.json android/app/google-services.json
          # Add permissions
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.READ_CONTACTS" \/>\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n<\/manifest>/' android/app/src/main/AndroidManifest.xml || true
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MzApps-FINAL-NOTIFICATION-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

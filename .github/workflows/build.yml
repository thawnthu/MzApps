name: Build MzApps APK
on: [push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v3
   - uses: actions/setup-node@v3
     with: {node-version: 18}
   - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/contacts
   - run: npx cap add android || true
   - run: |
      mkdir -p android/app/src/main
      echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.READ_CONTACTS"/><uses-permission android:name="android.permission.WRITE_CONTACTS"/></manifest>' > android/app/src/main/AndroidManifest.xml
   - run: npx cap copy
   - uses: actions/setup-java@v3
     with: {distribution: temurin, java-version: 17}
   - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
   - uses: actions/upload-artifact@v3
     with: {name: MzApps-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}

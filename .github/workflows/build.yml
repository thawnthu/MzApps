name: Build MzApps FINAL FIXED
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build FIXED SDK 23
        run: |
          rm -rf node_modules android www
          npm install --legacy-peer-deps
          npm install @capacitor/push-notifications @capacitor/android --legacy-peer-deps
          mkdir -p www
          cp index.html www/ || echo "no index"
          cp chat.html www/ || echo "no chat"
          echo "{\"appId\":\"com.mzapps.app\",\"appName\":\"MzApps\",\"webDir\":\"www\",\"server\":{\"cleartext\":true},\"plugins\":{\"PushNotifications\":{\"presentationOptions\":[\"badge\",\"sound\",\"alert\"]}}}" > capacitor.config.json
          npx cap add android
          # FIX MIN SDK 22 -> 23
          sed -i "s/minSdkVersion = 22/minSdkVersion = 23/g" android/variables.gradle || true
          sed -i "s/minSdkVersion 22/minSdkVersion 23/g" android/app/build.gradle || true
          sed -i "s/minSdk 22/minSdk 23/g" android/app/build.gradle || true
          npx cap copy
          cp google-services.json android/app/google-services.json
          cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MzApps-FIXED-NOTIFICATION-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup project
        run: |
          mkdir -p www
          echo "<html><body><h1>MzApps</h1><script>location.href='https://mz-apps.vercel.app'</script></body></html>" > www/index.html
          npm install
          npx cap add android
      - name: Add Permission
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_CONTACTS" \/>\n <uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n <application/' $FILE
          cat $FILE
      - name: Build APK
        run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MzApps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install || true

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Contact Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "Before fix:"
          cat $MANIFEST
          # Add permissions if not exists
          if ! grep -q "READ_CONTACTS" $MANIFEST; then
            sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_CONTACTS" \/>\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n    <uses-permission android:name="android.permission.GET_ACCOUNTS" \/>/' $MANIFEST
          fi
          echo "After fix:"
          cat $MANIFEST

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MzApps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
